<!DOCTYPE html>
<html>
<head>
    <title>Home</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<nav class="bg-gray-900 text-white">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between h-16 items-center">

            <div class="text-xl font-bold">
                <a href="/">MyApp</a>
            </div>

            <div class="flex space-x-6">

                <a href="/home" class="hover:text-yellow-400 transition">
                    Home
                </a>

                <a href="/contacts" class="hover:text-yellow-400 transition">
                    Contacts
                </a>

                <a href="/networks" class="hover:text-yellow-400 transition">
                    Telephone
                </a>

            </div>
        </div>
    </div>
</nav>

<div class="p-6">
    <h1 class="text-2xl font-bold">Welcome to Home Page 🎉</h1>
</div>
<div>
<div class="p-6 bg-gray-100 min-h-screen">

    <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-xl overflow-hidden">
        
        <!-- Title -->
        <div class="px-6 py-4 border-b">
            <h2 class="text-xl font-bold text-gray-700">Contacts List</h2>
        </div>

        <!-- Table -->
        <table class="min-w-full text-sm text-left text-gray-600">
            
            <!-- Header -->
            <thead class="bg-gray-800 text-white uppercase text-xs">
                <tr>
                    <th class="px-6 py-3">No</th>
                    <th class="px-6 py-3">Names</th>
                    <th class="px-6 py-3">Telephone</th>
                    <th class="px-6 py-3">Network</th>
                    <th class="px-6 py-3 text-center">Actions</th>
                </tr>
            </thead>

            <!-- Body -->
            <tbody>
                <tr th:each="c,i : ${allContacts}" 
                    class="border-b hover:bg-gray-100 transition duration-200">

                    <td class="px-6 py-4 font-medium text-gray-800" 
                        th:text="${i.index + 1}"></td>

                    <td class="px-6 py-4" 
                        th:text="${c.username}"></td>

                    <td class="px-6 py-4" 
                        th:text="${c.telephone}"></td>

                    <td class="px-6 py-4">
                        <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-semibold"
                              th:text="${c.network != null ? c.network.name : 'No Network'}">
                        </span>
                    </td>

                    <!-- Actions -->
                    <td class="px-6 py-4 text-center">
                        <div class="flex justify-center gap-2">

                            <a th:href="@{/update(id=${c.userId})}" 
                               class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded-md text-xs font-semibold shadow transition duration-300 hover:scale-105">
                                Update
                            </a>

                            <a th:href="@{/delete(id=${c.userId})}" 
                               class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-md text-xs font-semibold shadow transition duration-300 hover:scale-105">
                                Delete
                            </a>

                        </div>
                    </td>

                </tr>
            </tbody>

        </table>
    </div>

</div>
</div>
</body>
</html>
