<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>page2</title>
</head>
 <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-form {
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 400px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .question {
      margin-bottom: 20px;
    }

    .question label {
      display: block;
      margin: 5px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
<body>
	
	<form class="quiz-form" action="AnswerCheckerServlet" method="get">
	<h2>Quiz page1</h2>
  <div class="question">
    <p>4. Who wrote Romeo and Juliet? (1 mark)</p>
    <label><input type="radio" name="q4" value="A" required> A) Charles Dickens</label>
    <label><input type="radio" name="q4" value="B"> B) William Shakespeare</label>
    <label><input type="radio" name="q4" value="C"> C) Mark Twain</label>
    <label><input type="radio" name="q4" value="D"> D) Jane Austen</label>
  </div>

  <div class="question">
    <p>5. 12 ÷ 4 = ? (1 mark)</p>
    <label><input type="radio" name="q5" value="A" required> A) 2</label>
    <label><input type="radio" name="q5" value="B"> B) 4</label>
    <label><input type="radio" name="q5" value="C"> C) 3</label>
    <label><input type="radio" name="q5" value="D"> D) 6</label>
  </div>

  <div class="question">
    <p>6. What is the chemical symbol for water? (1 mark)</p>
    <label><input type="radio" name="q6" value="A" required> A) O₂</label>
    <label><input type="radio" name="q6" value="B"> B) H₂O</label>
    <label><input type="radio" name="q6" value="C"> C) CO₂</label>
    <label><input type="radio" name="q6" value="D"> D) NaCl</label>
  </div>

  <button type="submit">Submit Quiz</button>
</form>
</body>
</html>
