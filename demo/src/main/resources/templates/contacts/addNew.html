<!DOCTYPE html>
<html>
<head>
    <title>Add Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<nav class="bg-gray-900 text-white p-4">
    <a href="/home" class="mr-4 hover:text-yellow-400">Home</a>
    <a href="/contacts" class="mr-4 hover:text-yellow-400">Contacts</a>
    <a href="/networks" class="hover:text-yellow-400">Telephone</a>
</nav>

<div class="flex justify-center items-center mt-10">
    <form th:action="@{/contacts/add}" method="post" th:object="${contact}"
          class="bg-white p-6 rounded-2xl shadow-md w-full max-w-md">

        <h2 class="text-2xl font-bold mb-4 text-center">Add Contact</h2>

        <div class="mb-4">
			<input type="hidden" th:field="*{userId}" />
            <label class="block text-gray-700">Name</label>
            <input type="text" th:field="*{username}"
                   class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                   required>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700">Phone Number</label>
            <input type="text" th:field="*{telephone}"
                   class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                   required>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700">Telephone Network</label>
            <select th:field="*{network}" class="w-full px-3 py-2 border rounded-lg">
			    <option th:each="n : ${networks}"
			            th:value="${n.id}"
			            th:text="${n.name}">
			    </option>
			</select>
        </div>

        <button type="submit"
                class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
            Save Contact
        </button>

    </form>
</div>

</body>
</html>
